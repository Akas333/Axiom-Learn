name: Deploy

# Deploys the hosted app to Modal after CI passes on main (or by hand).
# Needs repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET
# (modal.com → Settings → API tokens). App secrets live in Modal itself
# (secret "kapany-secrets", see docs/hosting.md), never in GitHub.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  modal:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install modal
      - run: modal deploy deploy/modal/kapany.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
